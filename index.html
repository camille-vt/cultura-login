<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Login +cultura</title>
</head>
<body>
    <header>
        <div class="logo-img">
            <img src="assets/img/logocultura.png" alt="Logo +cultura">
        </div>
    </header>

    <main id="content">
        <div class="shape">
            <h1 class="login-title">LOGIN</h1>
            
            <div class="input-box">
                <label for="email">E-mail</label>
                <input id="email" type="email" name="email" placeholder="Digite seu e-mail" required>
            </div>
            <div class="input-box">
                <label for="password">Senha</label>
                <input id="password" type="password" name="password" placeholder="Digite sua senha" required>
            </div>

            <div class="entrar-button">
                <a href="#">Entrar</a>
            </div>

            <div id="links">
                <a href="https://camille-vt.github.io/cultura-cadastros/">Criar conta</a>
                <a href="#">Esqueci minha senha</a>
            </div>
        </div>
    </main>

    <footer>
        <span id="copyright">
            &copy 2024 +Cultura. Todos os direitos reservados.
        </span>
    </footer>
</body>
</html>
